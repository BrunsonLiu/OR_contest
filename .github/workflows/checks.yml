name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      solver_smoke:
        description: Run the small CPLEX integer-model check
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/lock-py312-windows.txt
      - run: python -m pip install -r requirements/lock-py312-windows.txt
      - run: python -m pip check
      - run: python tools/check_repository.py
      - run: python -m unittest discover -s tests -v
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.solver_smoke }}
        run: python tools/check_environment.py --solver-smoke --report environment.json
